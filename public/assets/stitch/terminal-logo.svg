<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="44" height="44" rx="12" fill="none" stroke="url(#glowGrad)" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Terminal Prompt >_ -->
  <path d="M14 16L22 24L14 32" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <line x1="26" y1="32" x2="34" y2="32" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>
